<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Escritório isométrico · JAS</title>
  <link rel="icon" href="assets/logo-marinho.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Aberto dentro do sistema JAS (/escritorio/isometrico). Os dados chegam pela página do app. -->
  <canvas id="cena" aria-label="Escritório em visão isométrica com os agentes de IA"></canvas>

  <header class="topo">
    <div class="marca">
      <div class="logo"><img src="assets/logo.webp" alt="Juliana Araújo Advocacia & Assessoria Jurídica"></div>
      <div class="marca-txt">
        <span class="sobre">Escritório virtual</span>
        <span id="resumo" class="resumo">—</span>
      </div>
    </div>
    <div class="relogio">
      <span id="hora">--:--</span>
      <span id="data"></span>
    </div>
  </header>

  <nav class="salas" id="salas" aria-label="Salas"></nav>

  <aside class="painel" id="painel" hidden>
    <button class="fechar" id="fechar" aria-label="Fechar">×</button>
    <div id="painel-conteudo"></div>
  </aside>

  <div class="controles">
    <button id="z-mais" title="Aproximar" aria-label="Aproximar">+</button>
    <button id="z-menos" title="Afastar" aria-label="Afastar">−</button>
    <button id="centro" title="Ver o escritório inteiro" aria-label="Ver o escritório inteiro">⤢</button>
    <button id="luz" title="Luz: automática pela hora" aria-label="Alternar dia e noite">◐</button>
  </div>

  <div class="dica" id="dica" hidden></div>
  <div class="avisos" id="avisos" aria-live="polite"></div>

  <!-- Carrega os scripts um de cada vez e tenta de novo se o servidor recusar (a Hostinger
       responde 429 quando muitos arquivos são pedidos juntos e o escritório ficava vazio). -->
  <script>
  (function () {
    var arquivos = ["iso", "mapa", "moveis", "equipe", "pessoas", "app", "ponte", "central"];
    var tentativas = 6;
    function carregar(i, tentativa) {
      if (i >= arquivos.length) return;
      var s = document.createElement("script");
      s.src = "js/" + arquivos[i] + ".js" + (tentativa ? "?t=" + tentativa : "");
      s.async = false;
      s.onload = function () { carregar(i + 1, 0); };
      s.onerror = function () {
        s.remove();
        if (tentativa + 1 >= tentativas) { console.error("Não carregou js/" + arquivos[i] + ".js"); return; }
        setTimeout(function () { carregar(i, tentativa + 1); }, 400 * Math.pow(2, tentativa));
      };
      document.body.appendChild(s);
    }
    carregar(0, 0);
  })();
  </script>
</body>
</html>
