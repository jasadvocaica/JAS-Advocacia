name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://mzwnljgujheumdslkloc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_APP_URL: https://faithful-screen-craft.ai.studio

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            resumo=$(tail -n 20 build-output.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Build de produção falhou::${resumo}"
          fi
          exit "$status"
