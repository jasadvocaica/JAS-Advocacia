name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agentes-djen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Verificar funções de servidor
        run: >-
          deno check --no-config --import-map=tests/agentes/deno-imports.json
          supabase/functions/agentes-disparar/index.ts
          supabase/functions/pje-comunica-sync/index.ts
          supabase/functions/controladoria-sync-calendar/index.ts
          supabase/functions/assistente-chat/index.ts
          supabase/functions/agentes-escritorio/index.ts
          supabase/functions/escritorio-vps/index.ts
          supabase/functions/clara-comando/index.ts
          supabase/functions/clara-acompanhar/index.ts
          supabase/functions/telegram/index.ts
          supabase/functions/motor-missoes/index.ts
          supabase/functions/zernio/index.ts
      - name: Validar transações DJEN em banco descartável
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/agentes/bootstrap.sql -f tests/agentes/fluxo.sql
      - name: Validar execuções concorrentes
        env:
          JAS_TEST_PGHOST: localhost
        run: python3 tests/agentes/concorrencia.py
      - name: Validar escritório e revisão humana
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/escritorio/bootstrap.sql -f tests/escritorio/fluxo.sql -f supabase/migrations/20261101165318_escritorio_salas.sql -f supabase/migrations/20261101165445_escritorio_chat_privilegios.sql -f tests/escritorio/salas-chat.sql
      - name: Validar personalização de agentes e worker privado
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261101201119_agentes_personalizaveis.sql -f supabase/migrations/20261101201329_agentes_isolamento_supervisora.sql -f supabase/migrations/20261101201654_agentes_revisao_estado.sql -f tests/escritorio/personalizacao.sql
      - name: Validar concorrência entre VPS e cron
        env:
          JAS_TEST_PGHOST: localhost
          JAS_TEST_DB: postgres
        run: python3 tests/escritorio/worker-concorrencia.py
      - name: Validar homologação Clara sem clientes de produção
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/clara/bootstrap.sql -f tests/clara/fluxo.sql -f tests/clara/acompanhamento.sql
      - name: Validar concorrência da Clara
        env:
          JAS_TEST_PGHOST: localhost
          JAS_TEST_DB: postgres
        run: python3 tests/clara/concorrencia.py
      - name: Validar limite diário de tokens
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/assistente/tokens-bootstrap.sql -f tests/assistente/tokens.sql
      - name: Validar concorrência do orçamento
        env:
          JAS_TEST_PGHOST: localhost
        run: python3 tests/assistente/tokens-concorrencia.py

  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://mzwnljgujheumdslkloc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_APP_URL: https://faithful-screen-craft.ai.studio

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Verificar TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Validar worker VPS e healthcheck
        run: node --test deploy/vps/worker.test.mjs

      - name: Executar testes
        run: npm test

      - name: Validar automações de Marketing
        run: |
          node tests/marketing/integrado-sql.mjs
          node tests/marketing/anuncios-sql.mjs
          node tests/marketing/rotinas-ia-sql.mjs
          node tests/marketing/entregas-ia-sql.mjs
          node tests/marketing/inteligencia-sql.mjs
          node tests/agentes/operacao24h-sql.mjs
          node tests/agentes/telegram-conversa-sql.mjs
          node tests/agentes/manu-entregas-sql.mjs

      - name: Validar biblioteca e produção jurídica
        run: |
          npm run test:legislacao
          npm run test:documentos:db
          npm run test:documentos:edge

      - name: Gerar build de produção
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            resumo=$(tail -n 20 build-output.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Build de produção falhou::${resumo}"
          fi
          exit "$status"
