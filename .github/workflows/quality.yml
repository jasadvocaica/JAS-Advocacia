name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agentes-djen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Verificar funções de servidor
        run: >-
          deno check --no-config --import-map=tests/agentes/deno-imports.json
          supabase/functions/agentes-disparar/index.ts
          supabase/functions/pje-comunica-sync/index.ts
          supabase/functions/controladoria-sync-calendar/index.ts
          supabase/functions/assistente-chat/index.ts
      - name: Validar transações DJEN em banco descartável
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/agentes/bootstrap.sql -f tests/agentes/fluxo.sql
      - name: Validar execuções concorrentes
        env:
          JAS_TEST_PGHOST: localhost
        run: python3 tests/agentes/concorrencia.py
      - name: Validar limite diário de tokens
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/assistente/tokens-bootstrap.sql -f tests/assistente/tokens.sql
      - name: Validar concorrência do orçamento
        env:
          JAS_TEST_PGHOST: localhost
        run: python3 tests/assistente/tokens-concorrencia.py

  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://mzwnljgujheumdslkloc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_APP_URL: https://faithful-screen-craft.ai.studio

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Verificar TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            resumo=$(tail -n 20 build-output.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Build de produção falhou::${resumo}"
          fi
          exit "$status"
